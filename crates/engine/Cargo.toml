[package]
name = "rcatan"
version = "0.1.0"
edition = "2024"

# The library has no benchmarks, and its built-in harness rejects Criterion's
# flags (e.g. --save-baseline) when `cargo bench` passes them to every target.
[lib]
bench = false

[dependencies]
arrayvec = "0.7.6"
bitvec = "1.1.1"
once_cell = "1.21.3"
rand = "0.10.0"
rand_chacha = "0.10.0"
rustc-hash = "2.1.3"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "engine"
harness = false
