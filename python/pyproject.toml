[project]
name = "catanbot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["torch>=2.9.1", "numpy", "catan-engine", "tqdm"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
catan-engine = { path = "../crates/engine_py", editable = true }

[tool.uv]
dev-dependencies = [
    "maturin",
    "pytest>=9.0.3",
    "pytest-watcher>=0.6.3",
]
reinstall-package = ["catan-engine"]

[tool.pyright]
venvPath = "."
venv = ".venv"
